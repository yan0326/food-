<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡江美食大富翁｜店家評論版</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 全螢幕彩帶特效畫布 -->
    <canvas id="fx-canvas"></canvas>

    <header class="top-bar">
        <div class="brand">
            <span class="logo-icon">🎲</span>
            <h1>淡江美食大富翁</h1>
        </div>
        <div class="header-actions">
            <button id="add-player-btn" class="icon-btn">+ 玩家</button>
            <button id="reset-btn" class="icon-btn danger">↺ 重置棋盤</button>
            <button id="clear-history-btn" class="icon-btn danger" title="清空所有歷史評論紀錄">🗑️ 清空紀錄</button>
        </div>
    </header>

    <main class="game-layout">
        <!-- 左側：經典 7x7 環狀大富翁棋盤 -->
        <section class="board-wrapper">
            <div class="board" id="board">
                <!-- 棋盤中央控制台 -->
                <div class="center-hub">
                    <div class="board-watermark">淡江美食大富翁</div>

                    <div class="player-turn-bar" id="player-status"></div>

                    <!-- 3D 雙骰區 -->
                    <div class="dice-stage">
                        <div class="scene">
                            <div class="cube" id="cube-1">
                                <div class="face face-1"><span class="pip"></span></div>
                                <div class="face face-2"><span class="pip"></span><span class="pip"></span></div>
                                <div class="face face-3"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span></div>
                                <div class="face face-4"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span></div>
                                <div class="face face-5"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                                <div class="face face-6"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span></div>
                            </div>
                        </div>

                        <div class="scene">
                            <div class="cube" id="cube-2">
                                <div class="face face-1"><span class="pip"></span></div>
                                <div class="face face-2"><span class="pip"></span><span class="pip"></span></div>
                                <div class="face face-3"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span></div>
                                <div class="face face-4"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span></div>
                                <div class="face face-5"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                                <div class="face face-6"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span></div>
                            </div>
                        </div>
                    </div>

                    <div class="status-banner" id="dice-result">輪到 玩家 1</div>

                    <button id="roll-btn" class="roll-btn">
                        <span>🎲 擲骰前進</span>
                    </button>
                </div>

                <!-- 獨立棋子動畫圖層 -->
                <div class="token-layer" id="token-layer"></div>
            </div>
        </section>

        <!-- 右側：淡江店家評論牆 -->
        <aside class="checkin-wall">
            <div class="wall-tabs">
                <button id="tab-store" class="wall-tab active">🏪 單店評論</button>
                <button id="tab-all" class="wall-tab">💬 全部評論</button>
            </div>

            <div class="wall-header">
                <div class="wall-title-group">
                    <h2 id="wall-title">⭐ 店家真實評論牆</h2>
                    <p id="wall-subtitle" class="wall-subtitle">擲骰踩中或點擊店家，查看分數與原因！</p>
                </div>
                <span class="count-badge" id="checkin-count">0 則</span>
            </div>

            <!-- 店家快速篩選下拉選單 -->
            <div class="category-bar" id="category-bar">
                <select id="category-select" class="category-select">
                    <option value="all">🌟 全部淡江店家評論</option>
                </select>
            </div>

            <!-- 單店平均分數摘要卡 -->
            <div id="store-summary" class="store-summary hidden"></div>

            <div id="feed-list" class="feed-list"></div>
        </aside>
    </main>

    <!-- 互動彈窗（佔領店家 / 過路費評論 / 角落休息格） -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-box" class="modal-box">
            <div class="modal-hero" id="modal-hero">🍜</div>
            <span id="modal-badge" class="badge">佔領地盤</span>
            <h3 id="modal-title">欣宏牛肉麵</h3>
            <p id="modal-desc">給予分數與評論原因即可佔領！</p>

            <div id="modal-top-hint" class="modal-top-hint hidden"></div>

            <form id="checkin-form" class="checkin-form hidden">
                <div class="rating-group">
                    <label for="food-score">⭐ 給予店家分數：</label>
                    <select id="food-score" class="score-select" required>
                        <option value="5">⭐⭐⭐⭐⭐ 5 分（極力推薦）</option>
                        <option value="4">⭐⭐⭐⭐ 4 分（好吃推推）</option>
                        <option value="3">⭐⭐⭐ 3 分（中規中矩）</option>
                        <option value="2">⭐⭐ 2 分（普通偏雷）</option>
                        <option value="1">⭐ 1 分（不推踩雷）</option>
                    </select>
                </div>
                <textarea id="food-comment" rows="3" placeholder="💬 寫下你的評論原因（例如：湯頭濃郁、肉大塊、CP值超高...）" required></textarea>

                <div class="modal-actions">
                    <button type="button" id="skip-btn" class="secondary-btn">先路過</button>
                    <button type="submit" class="roll-btn">送出評論</button>
                </div>
            </form>

            <div id="event-actions" class="modal-actions hidden">
                <button type="button" id="confirm-event-btn" class="roll-btn">太棒了！</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
